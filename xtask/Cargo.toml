[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
aws-lc-rs.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde_json.workspace = true
scraper.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
aws-lc-rs = "1.18.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde_json = "1.0.154"
scraper = { version = "0.29.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

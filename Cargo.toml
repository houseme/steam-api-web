[package]
name = "steam-api-web"
version = "0.5.0"
edition = "2024"
description = "Async Steam Web API client for authentication, commerce, financial reports, site licensing and broadcasts"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/houseme/steam-api-web"
homepage = "https://github.com/houseme/steam-api-web"
documentation = "https://docs.rs/steam-api-web"
keywords = ["steam", "steamworks", "webapi", "async"]
categories = ["api-bindings", "games", "web-programming::http-client"]
include = [
    "/src/**",
    "/examples/**",
    "/README.md",
    "/README_ZH.md",
    "/CHANGELOG.md",
    "/CHANGELOG_ZH.md",
    "/LICENSE",
]

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
aws-lc-rs = "1.18.2"
httpdate = "1.0.3"
itoa = "1.0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
url = "2.5.8"
wiremock = "0.6.5"
zeroize = "1.9.1"

[dependencies]
aws-lc-rs.workspace = true
httpdate.workspace = true
itoa.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "net", "io-util"] }
wiremock.workspace = true

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "request"
harness = false

[[bench]]
name = "integer"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"

[package.metadata.docs.rs]
all-features = true

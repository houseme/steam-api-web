name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact source revision to validate for a release.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.revision || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }}, stable)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build all targets
        run: cargo build --all-targets --all-features --locked
      - name: Test protocol, resilience and documentation
        run: cargo test --all-features --locked

  lint:
    name: Rust, repository and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Check bilingual documentation, license headers and TLS graph
        run: python3 scripts/check_repository.py
      - name: Test release guards without credentials or network
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

  documentation:
    name: Rust documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: Verify distributable crate
    needs: [test, lint, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: cargo package --locked --registry crates-io
      - name: Record package checksum
        run: |
          python3 <<'PY'
          import hashlib
          from pathlib import Path
          archives = list(Path("target/package").glob("steam-api-web-*.crate"))
          if len(archives) != 1:
              raise SystemExit("expected exactly one crate archive")
          archive = archives[0]
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name("SHA256SUMS").write_text(digest + "  " + archive.name + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: steam-api-web-package
          path: |
            target/package/steam-api-web-*.crate
            target/package/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 14

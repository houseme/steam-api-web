name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact source revision to validate for a release.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.revision || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }}, stable)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build all targets
        run: cargo build --workspace --all-targets --all-features --locked
      - name: Test protocol, resilience and documentation
        run: cargo test --workspace --all-features --locked
      - name: Test downstream arbitrary-precision compatibility
        if: runner.os == 'Linux'
        run: cargo test --lib --features serde_json/arbitrary_precision --locked

  lint:
    name: Rust, repository and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check bilingual documentation, license headers and TLS graph
        run: cargo xtask check-repository
      - name: Report documented Web API binding coverage
        run: cargo xtask coverage --json > target/api-coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: steam-api-web-coverage
          path: target/api-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Check published package contents
        run: cargo xtask release verify-package
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

  documentation:
    name: Rust documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: Verify distributable crate
    needs: [test, lint, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --package steam-api-web --locked --registry crates-io
      - name: Verify archive policy and record package checksum
        run: |
          set -euo pipefail
          archives=(target/package/steam-api-web-*.crate)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "::error::Expected exactly one crate archive."
            exit 1
          fi
          cargo xtask release verify-package --archive "${archives[0]}"
          cargo xtask release checksum --archive "${archives[0]}" --output target/package/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: steam-api-web-package
          path: |
            target/package/steam-api-web-*.crate
            target/package/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 14
